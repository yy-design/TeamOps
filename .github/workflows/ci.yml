name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: teamops_test
          POSTGRES_USER: teamops
          POSTGRES_PASSWORD: teamops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamops -d teamops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://teamops:teamops@localhost:5432/teamops_test?schema=public
      JWT_SECRET: ci-only-secret-with-more-than-32-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run test
      - run: npm run build
